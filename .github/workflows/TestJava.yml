name: Java CI Test

on:
  push:
    branches: [ "part3", "main", "part2" ]
  pull_request:
    branches: [ "part3", "main", "part2" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      working-directory: ./chatApplication
      run: mvn clean test
